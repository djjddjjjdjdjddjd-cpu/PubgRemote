name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Loyiha papkasini topish
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "Topilgan: $F"
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV
          ls -R . | head -50
      - name: APK yig'ish
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: PubgRemote-apk
          path: "**/app-debug.apk"
